services:
  db:
    image: mongo:8.0
    container_name: biblioteca-mongodb
    restart: unless-stopped
    ports:
      - "${DB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:         [
          "CMD",
          "mongosh",
          "--quiet",
          "--username", "${DB_USER}",
          "--password", "${DB_PASSWORD}",
          "--authenticationDatabase", "admin",
          "--eval", "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data: